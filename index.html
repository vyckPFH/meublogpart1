<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Blog do Fernandão</title>
    <meta charset="UTF-8">
</head>

<body>

    <header> <!-- sla    Fica no topo do site. Exemplo: logo | nome do blog -->
        <h1>Blog do Fernandão</h1>
    </header>

    <nav> <!-- Menu de navegação. Exemplo: Home | Posts | Sobre | Contato -->
        <a href="#">Home</a>
        <a href="#">Posts</a>
        <a href="#">Sobre</a>
    </nav>

    <section> <!--Divide partes do site. Exemplo: posts recentes | categorias -->

        <article> <!-- Usado para posts de blog. Cada post geralmente é um <article>. -->
            <h2>Meu primeiro post</h2>
            <p>Hoje estou aprendendo HTML e criando meu blog.</p>
        </article>

        <article>
            <h2>Aprendendo CSS</h2>
            <p>Agora vou começar a estilizar meu site.</p>
        </article>

    </section>

    <aside>
        <!-- Conteúdo lateral. Exemplo: posts populares | propaganda | perfil do autor -->
        <h3>Sobre mim</h3>
        <p>Sou o Fernandão aprendendo programação.</p>
    </aside>

    <footer> 
        <!-- Fica no final da página. Exemplo: © 2026 Blog do Fernandão -->
        <p>© 2026 Blog do Fernandão</p>
    </footer>

</body>

<!-- <link rel="stylesheet" href="nsei.css"> -->

</html>
